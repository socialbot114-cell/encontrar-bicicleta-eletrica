name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Restore App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8"
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          mkdir -p "$HOME/private_keys"
          cp "$RUNNER_TEMP/AuthKey.p8" "$HOME/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
      - name: Install signing assets
        env:
          APPLE_DISTRIBUTION_CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT }}
          APPLE_DISTRIBUTION_KEY: ${{ secrets.APPLE_DISTRIBUTION_KEY }}
          APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          printf '%s' "$APPLE_DISTRIBUTION_CERT" | base64 --decode > "$RUNNER_TEMP/distribution.cer"
          printf '%s' "$APPLE_DISTRIBUTION_KEY" | base64 --decode > "$RUNNER_TEMP/distribution.key"
          printf '%s' "$APPLE_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/CityBikes.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.key" -k "$KEYCHAIN_PATH" -P "" -A -T /usr/bin/codesign
          security import "$RUNNER_TEMP/distribution.cer" -k "$KEYCHAIN_PATH" -P "" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
           security list-keychains -d user -s "$KEYCHAIN_PATH"
           security default-keychain -s "$KEYCHAIN_PATH"
           security cms -D -i "$RUNNER_TEMP/CityBikes.mobileprovision" > "$RUNNER_TEMP/profile.plist"
           profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
           profile_name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
           team_id=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
           application_identifier=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
           test "$application_identifier" = "$team_id.br.com.citybikes"
           printf 'PROFILE_NAME=%s\n' "$profile_name" >> "$GITHUB_ENV"
           printf 'TEAM_ID=%s\n' "$team_id" >> "$GITHUB_ENV"
           mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
           cp "$RUNNER_TEMP/CityBikes.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/${profile_uuid}.mobileprovision"
      - name: Install dependencies and build web app
        run: |
          npm ci
          npm run build
          npx cap sync ios
          pod install --project-directory=ios/App
      - name: Archive
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App \
            -destination 'generic/platform=iOS' -configuration Release \
             -archivePath "$RUNNER_TEMP/CityBikes.xcarchive" \
             CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Apple Distribution" \
             PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
             DEVELOPMENT_TEAM="$TEAM_ID" \
             CURRENT_PROJECT_VERSION=3 MARKETING_VERSION=1.0.1 archive
      - name: Export IPA with Xcode
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as file:
              plistlib.dump({
                  'method': 'app-store',
                  'signingStyle': 'manual',
                  'teamID': os.environ['TEAM_ID'],
                  'provisioningProfiles': {'br.com.citybikes': os.environ['PROFILE_NAME']},
              }, file)
          PY
          rm -rf "$RUNNER_TEMP/export"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/CityBikes.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
      - name: Validate archive and IPA
        run: |
           test -d "$RUNNER_TEMP/CityBikes.xcarchive"
           app="$RUNNER_TEMP/CityBikes.xcarchive/Products/Applications/App.app"
           test -f "$app/PrivacyInfo.xcprivacy"
           /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist" | grep -qx 'br.com.citybikes'
           /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$app/Info.plist" | grep -qx 'Encontrar Bicicleta Elétrica'
           /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Info.plist" | grep -qx '3'
           /usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$app/Info.plist" | grep -qx 'false'
           codesign --verify --deep --strict "$app"
           ipa=("$RUNNER_TEMP"/export/*.ipa)
           test -f "${ipa[0]}"
           rm -rf "$RUNNER_TEMP/ipa-unpacked"
           mkdir -p "$RUNNER_TEMP/ipa-unpacked"
           unzip -q "${ipa[0]}" -d "$RUNNER_TEMP/ipa-unpacked"
           app=("$RUNNER_TEMP"/ipa-unpacked/Payload/*.app)
           test -f "${app[0]}/PrivacyInfo.xcprivacy"
           /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "${app[0]}/Info.plist" | grep -qx 'br.com.citybikes'
           /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app[0]}/Info.plist" | grep -qx '3'
           /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "${app[0]}/Info.plist" | grep -qx 'Encontrar Bicicleta Elétrica'
           codesign --verify --deep --strict "${app[0]}"
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: citybikes-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          ipa=("$RUNNER_TEMP"/export/*.ipa)
          xcrun altool --upload-app --type ios --file "${ipa[0]}" --apiKey "$APPLE_API_KEY_ID" --apiIssuer "$APPLE_API_ISSUER_ID"
