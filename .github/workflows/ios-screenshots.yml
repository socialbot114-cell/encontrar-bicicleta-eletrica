name: CityBikes iOS Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: citybikes-ios-screenshots
  cancel-in-progress: true

jobs:
  build:
    name: Build simulator app
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npm run build

      - name: Sync Capacitor iOS
        run: |
          npx cap sync ios
          pod install --project-directory=ios/App

      - name: Build simulator app
        run: |
          set -euo pipefail
          xcodebuild build \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO

          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "App.app" -type d -print -quit)
          fi
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$RUNNER_TEMP/CityBikes.app.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: citybikes-simulator-app
          path: ${{ runner.temp }}/CityBikes.app.zip
          if-no-files-found: error

  capture:
    name: Capture ${{ matrix.device.name }}
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device:
          - name: iPhone 17
            slug: iphone
            runtime: iOS-26-5
            width: 1206
            height: 2622
          - name: iPad Air 11-inch (M3)
            slug: ipad
            runtime: iOS-26-2
            width: 1640
            height: 2360

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: citybikes-simulator-app
          path: ${{ runner.temp }}/app-artifact

      - name: Capture native screenshots
        env:
          DEVICE_NAME: ${{ matrix.device.name }}
          DEVICE_SLUG: ${{ matrix.device.slug }}
          RUNTIME_SUFFIX: ${{ matrix.device.runtime }}
          EXPECTED_WIDTH: ${{ matrix.device.width }}
          EXPECTED_HEIGHT: ${{ matrix.device.height }}
        run: |
          set -euo pipefail

          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          data = json.load(sys.stdin)
          name, runtime_suffix = sys.argv[1:]
          for runtime, devices in data["devices"].items():
              if not runtime.endswith(runtime_suffix):
                  continue
              for device in devices:
                  if device["name"] == name and device["isAvailable"]:
                      print(device["udid"])
                      raise SystemExit(0)
          available = {
              runtime: [device["name"] for device in devices if device["isAvailable"]]
              for runtime, devices in data["devices"].items()
          }
          raise SystemExit(f"Simulator not found: {name} / {runtime_suffix}. Available: {available}")
          ' "$DEVICE_NAME" "$RUNTIME_SUFFIX")

          APP_ZIP="$RUNNER_TEMP/app-artifact/CityBikes.app.zip"
          APP_DIR="$RUNNER_TEMP/app"
          ditto -x -k "$APP_ZIP" "$APP_DIR"
          APP_PATH="$APP_DIR/App.app"
          test -d "$APP_PATH"

          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          sleep 20
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularBars 4

          OUTPUT_DIR="$RUNNER_TEMP/citybikes-$DEVICE_SLUG"
          mkdir -p "$OUTPUT_DIR"

          capture() {
            local name="$1"
            xcrun simctl io "$UDID" screenshot "$OUTPUT_DIR/$name.png"
            width=$(sips -g pixelWidth "$OUTPUT_DIR/$name.png" | awk '/pixelWidth:/{print $2}')
            height=$(sips -g pixelHeight "$OUTPUT_DIR/$name.png" | awk '/pixelHeight:/{print $2}')
            test "$width" = "$EXPECTED_WIDTH"
            test "$height" = "$EXPECTED_HEIGHT"
          }

          xcrun simctl launch "$UDID" br.com.citybikes
          sleep 12
          capture 01-explore

          xcrun simctl terminate "$UDID" br.com.citybikes 2>/dev/null || true
          xcrun simctl launch "$UDID" br.com.citybikes --citybikes-capture=map
          sleep 12
          capture 02-map

          xcrun simctl terminate "$UDID" br.com.citybikes 2>/dev/null || true
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl uninstall "$UDID" br.com.citybikes 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" br.com.citybikes --citybikes-capture=dark-map
          sleep 15
          capture 03-map-dark

          explore_hash=$(shasum -a 256 "$OUTPUT_DIR/01-explore.png" | cut -d ' ' -f 1)
          map_hash=$(shasum -a 256 "$OUTPUT_DIR/02-map.png" | cut -d ' ' -f 1)
          dark_hash=$(shasum -a 256 "$OUTPUT_DIR/03-map-dark.png" | cut -d ' ' -f 1)
          printf 'Screenshot hashes: explore=%s map=%s dark-map=%s\n' "$explore_hash" "$map_hash" "$dark_hash"
          test "$explore_hash" != "$map_hash"
          test "$map_hash" != "$dark_hash"
          ls -lh "$OUTPUT_DIR"

      - uses: actions/upload-artifact@v4
        with:
          name: citybikes-store-screenshots-${{ matrix.device.slug }}
          path: ${{ runner.temp }}/citybikes-${{ matrix.device.slug }}/*.png
          if-no-files-found: error
