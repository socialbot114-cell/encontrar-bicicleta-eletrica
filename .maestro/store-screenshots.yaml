appId: br.com.citybikes

---
- extendedWaitUntil:
    visible:
      text: "^(Find your next ride|Encontre sua próxima viagem|Encuentra tu próximo viaje|Trouvez votre prochain trajet)$"
    timeout: 45000
- takeScreenshot: 01-explore

- extendedWaitUntil:
    visible:
      id: network-search
    timeout: 60000
- takeScreenshot: 02-map

- tapOn:
    text: "Toggle Theme"
- takeScreenshot: 03-map-dark
