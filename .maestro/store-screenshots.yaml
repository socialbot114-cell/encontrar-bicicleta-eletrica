appId: br.com.citybikes

---
- launchApp:
    clearState: true
    stopApp: true

- extendedWaitUntil:
    visible:
      text: "^(Explore Map|Explorar Mapa)$"
    timeout: 45000
- waitForAnimationToEnd
- takeScreenshot: 01-landing

- tapOn:
    text: "^(Explore Map|Explorar Mapa)$"
    enabled: true
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: "network-search"
    timeout: 45000
- assertNotVisible:
    text: "^(Explore Map|Explorar Mapa)$"
- waitForAnimationToEnd
- wait: 10000
- takeScreenshot: 02-map

- tapOn:
    id: "Toggle Theme"
- wait: 2000
- waitForAnimationToEnd
- takeScreenshot: 03-map-dark
