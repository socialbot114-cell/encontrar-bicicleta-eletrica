appId: br.com.citybikes

---
- extendedWaitUntil:
    visible:
      text: "^(Explore Map|Explorar Mapa)$"
    timeout: 45000
- takeScreenshot: 01-landing

- tapOn:
    text: "^(Explore Map|Explorar Mapa)$"
    enabled: true
- extendedWaitUntil:
    visible:
      text: "Find near me"
    timeout: 60000
- assertNotVisible:
    text: "^(Explore Map|Explorar Mapa)$"
- takeScreenshot: 02-map

- tapOn:
    text: "Toggle Theme"
- takeScreenshot: 03-map-dark
